<!DOCTYPE html>
<html lang="en">
  <head>
    
    <link rel="stylesheet" href="styles.css">

    <title>Sign Up</title>

  </head>
  <body>
    <h1 class="charter-bold">Sign up Screen</h1>

    <div class="form-group">
      <label class="charter" for="username">Username:</label>
      <input
        class="charter"
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
      />
    </div>

    <div class="form-group">
      <label class="charter" for="pass"
        >Password (6 characters minimum):</label
      >
      <input
        class="charter"
        type="password"
        id="pass"
        name="password"
        minlength="6"
        placeholder="Enter your password"
      />
    </div>

    <div class="form-group">
      <label class="charter">Repeat Password:</label>
      <input
        class="charter"
        type="password"
        id="passRepeat"
        name="password"
        minlength="6"
        placeholder="Repeat your password"
      />
    </div>

    <div class="form-group">
      <label class="charter" for="email">e-mail:</label>
      <div class="email-container">
        <input
          class="charter"
          type="email"
          id="email"
          name="e-mail"
          placeholder="Enter your email"
        />
        <button class="charter" id="sendCode" disabled>Send the Code</button>
      </div>
    </div>

    <div class="form-group">
      <label class="charter">Please enter the code here:</label>
      <input
        class="charter"
        id="codeEntered"
        minlength="6"
        maxlength="6"
        placeholder="123456"
      />
    </div>

    <button class="charter" id="signupButton" disabled>Sign Up</button>

    <a href="LogIn.html" class="form-group">
      <button class="charter" id="redirectButton">
        I already have an account
      </button>
    </a>

    <script type="module">
        import { Client, Account } from "https://esm.sh/appwrite";
      
        const client = new Client()
          .setEndpoint("https://cloud.appwrite.io/v1")
          .setProject("67fab4540027acd187eb");
      
        const account = new Account(client);
      
        //sign the user up
        account.create('unique()', 'user@example.com', 'password123')
          .then(console.log)
          .catch(console.error);
    </script>

  </body>
</html>
