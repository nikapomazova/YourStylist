<!DOCTYPE html>
<html>
<head>

  <title>Verify Email</title>

  <style>
    h3 {
        color:#B15A63;
        text-align: center;
        position: static;
        font-size:9vh;
    }
    h4 {
        color:#c81123;
        font-weight: 200;
        text-align: center;
        position: static;
        font-size:4vh;
    }
  </style>

</head>
<body>

  <h3 id = "status">Verifying your email...</h3>
  <h4 id="errorMsg"></h4>
  
  <script>

    import { getAuth, applyActionCode } from "firebase/auth";
    import { auth } from "./firebase-config.js";

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get('oobCode'); //firebase's verification code

    if (oobCode) {
        try {
            await applyActionCode(auth, oobCode);
            document.getElementById('status').textContent ='Email verified successfully! You can now login.';
            setTimeout(() => {
                window.location.href = '/LogIn.html';
            }, 3000);
        } catch (error) {
            document.getElementById('errorDisplay').textContent = error.message;
            if (confirm("Go to sign up?")) {
                window.location.href = "/index.html";
            }
        }
    }
  </script>
</body>
</html>
