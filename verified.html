<!DOCTYPE html>
<html>
<head>

  <title>Verify Email</title>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@9.0.0"></script>

  <style>
    h3 {
        color:#B15A63;
        text-align: center;
        position: static;
        font-size:9vh;
    }
  </style>

</head>
<body>

  <h3 id = "status">Verifying your email...</h1>
  
  <script>

    const client = new Client()
      .setEndpoint('https://cloud.appwrite.io/v1')
      .setProject('YOUR_PROJECT_ID');

    const account = new Account(client);

    //extract the unique token from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');

    async function verifyEmail() {
      try {
        //confirm the token is valid
        await account.updateVerification(userId, secret);
        document.getElementById('status').textContent = "Email verified successfully! Redirecting to Log In screen.";
        window.location.href = '/LogIn.html'; //redirect to login screen
      } catch (error) {
        document.getElementById('status').textContent = "Verification failed. Redirecting to Sign Up screen.";
        window.location.href = '/index.html'; //redirect to signup screen
      }
    }

    //running verification when page loads
    verifyEmail();
  </script>
</body>
</html>
