<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Test</title>

    <link rel="stylesheet" href="styles.css">

    <script type="module" src="firebaseInitializing.js?v=1.0" defer></script>

    <script type="module" src="login.js" defer></script>
    <script type="module" defer>
        import {auth, doc, setDoc, db} from "./firebaseInitializing.js?v=1.0";
    </script>

    <style>
        section {
            width: 100%;
            height: auto;
            flex-direction: row;
            align-items: left;
        }
    </style>

  </head>

  <body>

    <section>
        <button id="menuB" href="Menu.html" class="menu-button">
            Menu
        </button>
    </section>

    <h1 class="charter">Test</h1>

    <div id="quiz-container"></div>

    <script>
        document.getElementById("menuB").addEventListener("click", function() {
            window.location.href = "Main.html";
        });
        const quizData = [
            {
                question: "What type of clothes do you usually wear?",
                answers: [{text: "Casual", image: "answerSampleButton.png"},
                {text: "Sporty", image: "answerSampleButton.png"},
                {text: "Formal", image: "answerSampleButton.png"},
                {text: "Streetwear", image: "answerSampleButton.png"}
                ]
                
            },
            {
                question: "What best describes your daily lifestyle?",
                answers: [{text: "Office", image: "answerSampleButton.png"},
                {text: "School", image: "answerSampleButton.png"},
                {text: "Active", image: "answerSampleButton.png"},
                {text: "Homebody", image: "answerSampleButton.png"}
                ]
            },
            {
                question: "What's your preferred fit?",
                answers: [{text: "Tight", image: "answerSampleButton.png"},
                {text: "Tailored", image: "answerSampleButton.png"},
                {text: "Relaxed", image: "answerSampleButton.png"},
                {text: "Oversized", image: "answerSampleButton.png"}
                ]
            },
            {
                question: "Which color palette do you usually wear?",
                answers: [{text: "Neutrals", image: "answerSampleButton.png"},
                {text: "Pastels", image: "answerSampleButton.png"},
                {text: "Warm", image: "answerSampleButton.png"},
                {text: "Bold & Bright", image: "answerSampleButton.png"}
                ]
            }
        ];

        const container = document.getElementById("quiz-container");
        const quizAnswers = {};

        quizData.forEach((item, index) => {
            const questionDiv = document.createElement("div");
            questionDiv.classList.add("question");

            const h2 = document.createElement("h2");
            h2.textContent = `Question ${index + 1}: ${item.question}`;
            questionDiv.appendChild(h2);

            const answersDiv = document.createElement("div");
            answersDiv.classList.add("answers");

            item.answers.forEach(answer => {

                const btn = document.createElement("button");
                btn.textContent = answer.text;

                btn.addEventListener("click", () => {
                    const allButtons = answersDiv.querySelectorAll("button");
                    allButtons.forEach(b => b.classList.remove("selected")); //deselecting all the buttons in this answer group

                    btn.classList.add("selected");

                    quizAnswers[index] = answer.text;
                    console.log(quizAnswers[index]);
                });

                answersDiv.appendChild(btn);
            });

            questionDiv.appendChild(answersDiv);
            container.appendChild(questionDiv);
        });
    </script>

    <button class = "done-button" id = "doneButton">
        <img src="doneButton.png" alt="Done Button"/>
    </button>

    <script type="module">

        localStorage.setItem("email", "nika");
    
        async function logResults() {

            const user = auth.currentUser;
    
            if (!user) {
                alert("No user is logged in!");
                return;
            }

            try {
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, {
                    quizAnswers: quizAnswers
                }, { merge: true });

                alert("Quiz answers saved successfully!");
            } catch (error) {
                console.error("Error saving quiz answers: ", error);
                alert("Failed to save quiz answers.");
            }

        }

        document.getElementById("doneButton").addEventListener("click", logResults);
    
    </script>

    <script type="module">
        import {initAuthListener} from './isSignedIn.js';
        console.log("script loaded");
        initAuthListener();
    </script>

  </body>

</html>
