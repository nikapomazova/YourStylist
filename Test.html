    <script>
        document.getElementById("menuB").addEventListener("click", function() {
            window.location.href = "Main.html";
        });
        const quizData = [
            {
                question: "What type of clothes do you usually wear?",
                answers: [{text: "Casual", image: "answerSampleButton.png"},
                {text: "Sporty", image: "answerSampleButton.png"},
                {text: "Formal", image: "answerSampleButton.png"},
                {text: "Streetwear", image: "answerSampleButton.png"}
                ]
                
            },
            {
                question: "What best describes your daily lifestyle?",
                answers: [{text: "Office", image: "answerSampleButton.png"},
                {text: "School", image: "answerSampleButton.png"},
                {text: "Active", image: "answerSampleButton.png"},
                {text: "Homebody", image: "answerSampleButton.png"}
                ]
            },
            {
                question: "What's your preferred fit?",
                answers: [{text: "Tight", image: "answerSampleButton.png"},
                {text: "Tailored", image: "answerSampleButton.png"},
                {text: "Relaxed", image: "answerSampleButton.png"},
                {text: "Oversized", image: "answerSampleButton.png"}
                ]
            },
            {
                question: "Which color palette do you usually wear?",
                answers: [{text: "Neutrals", image: "answerSampleButton.png"},
                {text: "Pastels", image: "answerSampleButton.png"},
                {text: "Warm", image: "answerSampleButton.png"},
                {text: "Bold & Bright", image: "answerSampleButton.png"}
                ]
            }
        ];

        const container = document.getElementById("quiz-container");

        quizData.forEach((item, index) => {
            const questionDiv = document.createElement("div");
            questionDiv.classList.add("question");

            const h2 = document.createElement("h2");
            h2.textContent = `Question ${index + 1}: ${item.question}`;
            questionDiv.appendChild(h2);

            const answersDiv = document.createElement("div");
            answersDiv.classList.add("answers");

            item.answers.forEach(answer => {
                const btn = document.createElement("button");
                btn.textContent = answer.text;
                btn.classList.add("quiz-answer-button");
                answersDiv.appendChild(btn);
            });

            questionDiv.appendChild(answersDiv);
            container.appendChild(questionDiv);
        });
    </script>
