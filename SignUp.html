<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>Sign Up</title>

    <style>

        .charter {
            font-family: "Charter", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal; 
        }

        .charter-bold {
            font-family: "Charter", sans-serif;
            font-optical-sizing: auto;
            font-weight: 1000;
            font-style: normal; 
        }

        h1 {
            text-align: center;
            color: #a8693c;
        }

        label {
            color: #a8693c;
        }

        p {
            color: #a8693c;
            font-family: "Arial", serif;
            text-align: center;
        }

      body {
        background-color: rgb(250, 222, 170);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .form-group label {
        width: 200px;
        text-align: right;
        margin-right: 10px;
      }

      .email-container {
        display: flex;
        width: 100%;
      }

      .email-container input {
        flex: 2;
        padding: 5px;
        height: auto;
      }

      .email-container button {
        flex: 1;
        padding: 5px 10px;
        margin-left: 10px;
        background-color: #ffffff;
        color: #a8693c;
      }

      .form-group input {
        width: 200px;
        padding: 5px;
      }

      #signupButton:enabled {
        display: block;
        margin: 10px auto;
        padding: 10 20;
        color: #a8693c;
        background-color: #ffffff;
        cursor: pointer;
      }

      #signupButton:disabled {
        display: block;
        margin: 10px auto;
        padding: 10 20;
        color: #a8693c;
        background-color: #cbb3a2;
      }

      #redirectButton {
        background-color: #ffffff;
        color: #a8693c;
        cursor: pointer;
      }

      #sendCode:enabled {
        display: block;
        margin: 10px auto;
        padding: 10 20;
        color: #a8693c;
        background-color: #ffffff;
        cursor: pointer;
      }

      #sendCode:disabled {
        display: block;
        margin: 10px auto;
        padding: 10 20;
        color: #a8693c;
        background-color: #cbb3a2;
      }

    </style>
  </head>
  <body>
    <h1 class="charter-bold">Sign up Screen</h1>

    <div class="form-group">
      <label class="charter" for="username">Username:</label>
      <input
        class="charter"
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
      />
    </div>

    <div class="form-group">
      <label class="charter" for="pass"
        >Password (6 characters minimum):</label
      >
      <input
        class="charter"
        type="password"
        id="pass"
        name="password"
        minlength="6"
        placeholder="Enter your password"
      />
    </div>

    <div class="form-group">
      <label class="charter">Repeat Password:</label>
      <input
        class="charter"
        type="password"
        id="passRepeat"
        name="password"
        minlength="6"
        placeholder="Repeat your password"
      />
    </div>

    <div class="form-group">
      <label class="charter" for="email">e-mail:</label>
      <div class="email-container">
        <input
          class="charter"
          type="email"
          id="email"
          name="e-mail"
          placeholder="Enter your email"
        />
        <button class="charter" id="sendCode" disabled>Send the Code</button>
      </div>
    </div>

    <div class="form-group">
      <label class="charter">Please enter the code here:</label>
      <input
        class="charter"
        id="codeEntered"
        minlength="6"
        maxlength="6"
        placeholder="123456"
      />
    </div>

    <button class="charter" id="signupButton" disabled>Sign Up</button>

    <a href="loginScreen.html" class="form-group">
      <button class="charter" id="redirectButton">
        I already have an account
      </button>
    </a>

  </body>
</html>
