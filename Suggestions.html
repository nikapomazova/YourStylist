<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Your Stylist</title>

    <link rel="stylesheet" href="styles.css">

    <style>

        .rectangle {
            background: #B15A63;
            display: flex;
            padding: 1vw;
            border-radius: 2vh;
            width: 40vh;
            height: auto;
            margin: 3vh;
            font-size: 3vh;
            color:rgb(246, 233, 235);
            transition: all 0.3s ease;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            line-height: 1;
            position: static;
        }

        .rectangle:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(97,19,26,0.3); /*add shadow*/
        }

        .rectangle-link { /*so that the link doesnt include the hyperlink and it looks nice*/
            text-decoration: none;
            color: inherit;
            display: contents;
        }

        .rectangle img {
            width: 10vh;
            position: static;
            border-radius: 1vh;
            filter: invert(100%);
        }

        section {
            width: 100%;
            height: auto;
            flex-direction: row;
            align-items: left;
        }

    </style>

  </head>

  <body>

    <input type="hidden" id="uidDisplay" name="uid"> <!--for saving the users uid and accessing it from everywhere-->

    <section>
        <button id="menuB" href="/Menu.html" class="menu-button">
            Menu
        </button>
    </section>

    <button type="button" class="rectangle" id="generate">Generate Outfit</button>

    <script>
        document.getElementById("menuB").addEventListener("click", function() {
            window.location.href = "Main.html";
        });
    </script>

    <p id="loadingText" style="display: none; font-size: 2vh; text-align: center; color: #B15A63;">
        Generating your outfit... Please wait!
    </p>

    <h3 id="preferences"></h3>

    <div id="multiCarouselContainer"></div>

    <script type="module">

        //FOR THE UID FETCHING

        import { auth, onAuthStateChanged, getDocs, collection, db, getDoc, doc } from "./firebaseInitializing.js?v1.0.0";

        let slideIndexes = [0, 0, 0, 0];

        function moveSlide(carouselIndex, n) {
            showSlide(carouselIndex, slideIndexes[carouselIndex] + n);
        }

        document.addEventListener('click', (e) => { //when the user clicks on the button, this function sees which button exacly and puts it into index into the function
            if (e.target.classList.contains('prev')) {
                const index = parseInt(e.target.dataset.index);
                moveSlide(index, -1);
            } else if (e.target.classList.contains('next')) {
                const index = parseInt(e.target.dataset.index);
                moveSlide(index, 1);
            }
        });

        let uid = null;
        const multiCarouselContainer = document.getElementById("multiCarouselContainer");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                uid = user.uid;
                document.getElementById("uidDisplay").value = uid;

                const loadingText = document.getElementById("loadingText");

                const userDocRef = doc(db, "users", uid);
                const userDocSnap = await getDoc(userDocRef);
                let quizAnswers = [];

                if (userDocSnap.exists()) {
                    const rawAnswers = userDocSnap.data().quizAnswers;
                    if (Array.isArray(rawAnswers)) {
                        quizAnswers = rawAnswers;
                    } else if (typeof rawAnswers === "object") {
                        quizAnswers = Object.values(rawAnswers);
                    } else {
                        quizAnswers = []; // fallback
                    }
                }

                document.getElementById("preferences").textContent = "The outfit will be generated based on uploaded clothes and these parameters from the quiz: " + quizAnswers;

                //for creating outfit!

                document.getElementById("generate").addEventListener("click", async () => {

                    const loadingText = document.getElementById("loadingText");
                    loadingText.style.display = "block"; //show loading text
                    loadingText.textContent = "Generating your outfit... Please wait!";

                    try {

                        const imageDocsSnapshot = await getDocs(collection(db, "users", uid, "images"));
                        const imageDescriptions = [];

                        imageDocsSnapshot.forEach((doc) => {
                            const data = doc.data();
                            imageDescriptions.push({
                                id: doc.id,
                                description: data.description,
                            });
                        });

                        const prompt = `You are a fashion stylist. The user's style preferences are: ${quizAnswers.join(", ")} colours. Here is a list of clothing items with descriptions and IDs. Choose exactly 3 items that go well together to form a stylish outfit. Return only a JSON array with the 3 selected IDs — like this: ["img1.jpg", "img2.jpg", "img3.jpg"]. Do not include any explanation. Only output the array.

                        Items:
                        ${imageDescriptions.map(item => `- ${item.id}: ${item.description}`).join('\n')}

                        Only respond with a JSON array of the 3 selected IDs.`;

                        const response = await fetch('/openai', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt }),
                        });

                        const data = await response.json();
                        // const selectedImageIds = data.result; //expecting: ["img1.jpg", "img2.jpg", "img3.jpg"]

                        let selectedImageIds = data.result;
                        console.log("AI response: " + selectedImageIds);

                        if (typeof selectedImageIds === "string") {
                            try {
                                selectedImageIds = JSON.parse(selectedImageIds);
                            } catch (e) {
                                console.log("AI returned invalid JSON string: ", selectedImageIds + ". Error: " + e);
                                loadingText.textContent = "Error: AI gave bad output. Please try again!";
                                return;
                            }
                        }

                        console.log("The selected images: " + selectedImageIds);

                        //for making carousel!

                        multiCarouselContainer.innerHTML = "";

                        const outfitImages = selectedImageIds.map(id => `https://yourstylist.stereopi.com/uploads/${uid}/${id}`);

                        loadingText.style.display = "none"; //hide once done

                        createCarousel(outfitImages, 0);
                        showSlide(0, 0);
                    } catch (error) {
                        loadingText.textContent = "Something went wrong!";
                        console.log("Error!!! " + error);
                    }

                });

            } else {
                console.log("No user is signed in.");
            }
        });

        //FOR CAROUSEL LOGIC

        function createCarousel(images, index) {
            const carouselId = `carousel${index}`;
            const dotsId = `dots${index}`;
            const wrapper = document.createElement("div");
            wrapper.className = "carousel";
            wrapper.id = carouselId;

            //create image container
            const imageContainer = document.createElement("div");
            imageContainer.className = "carousel-images";

            images.forEach((img, i) => {
                const imgTag = document.createElement("img");
                imgTag.src = img;
                imgTag.className = "carousel-image";
                imageContainer.appendChild(imgTag);
            });

            wrapper.appendChild(imageContainer);

            //left and right arrrows
            const prevBtn = document.createElement('button');
            prevBtn.className = 'carousel-btn prev';
            prevBtn.id = `prevBtn${index}`;
            prevBtn.innerHTML = '&#10094;';
            prevBtn.dataset.index = index;

            const nextBtn = document.createElement('button');
            nextBtn.className = 'carousel-btn next';
            nextBtn.id = `nextBtn${index}`;
            nextBtn.innerHTML = '&#10095;';
            nextBtn.dataset.index = index;

            const dotsDiv = document.createElement('div');
            dotsDiv.className = 'carousel-dots';
            dotsDiv.id = dotsId;

            wrapper.append(prevBtn, nextBtn, dotsDiv);

            document.getElementById("multiCarouselContainer").appendChild(wrapper);

            //generating dots
            const dotsContainer = document.getElementById(dotsId);
            for (let i = 0; i < images.length; i++) {
                const dot = document.createElement("span");
                dot.className = "dot";
                dot.addEventListener("click", () => showSlide(index, i));
                dotsContainer.appendChild(dot);
            }
        }

        function showSlide(carouselIndex, n) {
            const carousel = document.getElementById(`carousel${carouselIndex}`);
            const images = carousel.querySelectorAll(".carousel-image");
            const dots = document.querySelectorAll(`#dots${carouselIndex} .dot`);

            if (n >= images.length) n = 0;
            if (n < 0) n = images.length - 1;

            images.forEach((img, i) => {
                img.style.display = (i === n) ? "block" : "none";
            });

            dots.forEach((dot, i) => {
                dot.classList.toggle("active", i === n);
            });

            slideIndexes[carouselIndex] = n;
        }

    </script>

    <h3>Made by: Nika</h3>

  </body>

</html>
