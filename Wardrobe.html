<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Your Stylist</title>

    <link rel="stylesheet" href="styles.css">

    <style>

        .rectangle {
            background: #B15A63;
            display: flex;
            padding: 1vw;
            border-radius: 2vh;
            width: 10vh;
            height: 10vh;
            margin: 3vh;
            transition: all 0.3s ease; /*for animation*/
            cursor: pointer;
            justify-content: center;
            align-items: center;
            font-size: 10vh; /* control "+" size */
            line-height: 1;
            position: static;
        }

        .rectangle:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(97,19,26,0.3); /*add shadow*/
        }

        .rectangle-link { /*so that the link doesnt include the hyperlink and it looks nice*/
            text-decoration: none;
            color: inherit;
            display: contents;
        }

        .rectangle img {
            width: 10vh;
            position: static;
            border-radius: 1vh;
            filter: invert(100%);
        }

        p {
            font-family: var(--main-font);
            font-size: 4vh;
            font-weight: 600;
            color: #f6eaeb;
            grid-column: 2;
            grid-row: 2;
            align-self: start;
            margin-top: 0;
        }

        h4 {
            font-family: var(--main-font);
            font-size: 8vh;
            font-weight: 900;
            color: #f6eeef;
            grid-column: 2;
            grid-row: 1;
            align-self: end;
            margin-bottom: 0;
        }

        .smallRectImg {
            height: auto;
            width: 80%;
            position: static;
            border-radius: 1vh;
            grid-column: 1;
            grid-row: 1;
            justify-self: center;
            grid-row: 1 / span 2; /*so that it takes both rows*/
            align-self: center;
            justify-self: center;
        }

        .smallRectText {
            font-family: var(--main-font);
            font-size: 4vh;
            font-weight: 600;
            color: #f6eaeb;
            grid-column: 2;
            grid-row: 1 / span 2; /*so that it takes both rows*/
            align-self: center;
            margin-top: 0;
        }

    </style>

  </head>

  <body>

    <input type="hidden" id="uidDisplay" name="uid">

    <form id = "uploadForm" method="post" enctype="multipart/form-data">
        <input type="file" name="fileToUpload" id="fileToUpload" style="display: none;">
        <button type="button" class="rectangle" id="addPic">
            <img src="plus.png"/>
        </button>
    </form>

    <div id="imageContainer"></div>

    <script type="module">
        import { auth, onAuthStateChanged } from "./firebaseInitializing.js";

        let uid = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uid = user.uid;
                document.getElementById("uidDisplay").value = uid;
                const form = document.getElementById("uploadForm");
                form.action = `upload.php?ufolder=${uid}`;
                console.log("User is signed in. UID:", uid);
            } else {
                console.log("No user is signed in.");
            }
        });

        import {initAuthListener} from './isSignedIn.js';
        document.addEventListener('DOMContentLoaded', initAuthListener);

        const fileUploaded = document.getElementById("fileToUpload");
        const addPicButton = document.getElementById("addPic");
        const uploadForm = document.getElementById("uploadForm");

        addPicButton.addEventListener("click", () => {
            fileUploaded.click();
        });

        fileUploaded.addEventListener("change", () => {
            if (fileUploaded.files.length > 0) {
                uploadForm.submit(); //when files are submitted submit the form automatically
                window.location.reload();
            }
        });

        const imageContainer = document.getElementById("imageContainer");

        fetch(`upload.php?ufolder=${uid}`) //fetching images from the PHP script
        .then(response => response.text())
        .then(data => {
            imageContainer.innerHTML = data;  //putting the images into the container, ie the div
        })
        .catch(error => {
            console.error("Error fetching images:", error);
        });

    </script>

    <h3>Made by: Nika</h3>

    <script> //for displaying pictures

    </script>

  </body>

</html>
