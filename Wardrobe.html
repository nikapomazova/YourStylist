<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Your Stylist</title>

    <link rel="stylesheet" href="styles.css">

    <style>

        .rectangle {
            background: #B15A63;
            display: flex;
            padding: 1vw;
            border-radius: 2vh;
            width: 10vh;
            height: 10vh;
            margin: 3vh;
            transition: all 0.3s ease; /*for animation*/
            cursor: pointer;
            justify-content: center;
            align-items: center;
            line-height: 1;
            position: static;
        }

        .rectangle:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(97,19,26,0.3); /*add shadow*/
        }

        .rectangle-link { /*so that the link doesnt include the hyperlink and it looks nice*/
            text-decoration: none;
            color: inherit;
            display: contents;
        }

        .rectangle img {
            width: 10vh;
            position: static;
            border-radius: 1vh;
            filter: invert(100%);
        }

        section {
            width: 100%;
            height: auto;
            flex-direction: row;
            align-items: left;
        }

        /* for images */

        /* container */
        .image-item {
            position: relative;
            display: inline-block;
            width: calc(24vw - 10px);
            height: auto;
            margin: 3vh;
            transition: transform 0.3s ease; /* for smooth transition */
        }

        /* for the image itself */
        .image-item img {
            width: 100%;
            height: auto;
            border-radius: 1vh;
            display: block;
        }

        /* for the overlay */
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.7); /* white with 70% opacity */
            color: #000;
            font-size: 4vh;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 1vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .image-item:hover {
            transform: scale(1.05);
        }

        .image-item:hover .image-overlay {
            display: flex;
        }

        /* for fade in */

        .image-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-item:hover .image-overlay {
            opacity: 1;
        }

    </style>

  </head>

  <body>

    <section>
        <button id="menuB" href="/Menu.html" class="menu-button">
            Menu
        </button>
    </section>

    <script>
        document.getElementById("menuB").addEventListener("click", function() {
            window.location.href = "Main.html";
        });
    </script>

    <input type="hidden" id="uidDisplay" name="uid">

    <form id = "uploadForm" method="post" enctype="multipart/form-data">
        <input type="file" name="fileToUpload" id="fileToUpload" style="display: none;">
        <button type="button" class="rectangle" id="addPic">
            <img src="plus.png"/>
        </button>
    </form>

    <div id="imageContainer"></div>

    <script type="module">
        import { auth, onAuthStateChanged, doc, db, collection, addDoc, getDocs } from "./firebaseInitializing.js?v1.0.0";

        let uid = null;
        const imageContainer = document.getElementById("imageContainer");
        const fileUploaded = document.getElementById("fileToUpload");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                uid = user.uid;
                document.getElementById("uidDisplay").value = uid;

                const imagesRef = collection(db, "users", uid, "images");
                const imageDocs = await getDocs(imagesRef);

                const imageDescriptionsMap = {};
                imageDocs.forEach(doc => {
                    const data = doc.data();
                    if (data.name && data.description) {
                        imageDescriptionsMap[data.name] = data.description;
                    }
                });

                const form = document.getElementById("uploadForm");
                form.action = `upload.php?ufolder=${uid}`;
                // console.log(`upload.php?ufolder=${uid}`);
                // console.log("User is signed in. UID:", uid);

                fetch(`display.php?ufolder=${uid}`) //fetching images from the PHP script
                    .then(response => response.json())
                    .then(files => {
                        imageContainer.innerHTML = ""; // clear before insert
                        files.forEach(filename => {
                            const container = document.createElement("div");
                            container.className = "image-item";

                            const img = document.createElement("img");
                            img.src = `uploads/${uid}/${filename}`;
                            img.alt = filename;

                            const overlay = document.createElement("div");
                            overlay.className = "image-overlay";
                            overlay.textContent = imageDescriptionsMap[filename] || "No description";

                            container.appendChild(img);
                            container.appendChild(overlay);

                            // container.addEventListener("mouseenter", () => {
                            //     overlay.style.display = "flex";
                            //     img.style.transform = "scale(1.05)";
                            // });
                            // container.addEventListener("mouseleave", () => {
                            //     overlay.style.display = "none";
                            //     img.style.transform = "scale(1)";
                            // });

                            imageContainer.appendChild(container);
                        });
                    });
            } else {
                console.log("No user is signed in.");
            }
        });

        const addPicButton = document.getElementById("addPic");
        const uploadForm = document.getElementById("uploadForm");

        addPicButton.addEventListener("click", () => {
            fileUploaded.click();
        });

        fileUploaded.addEventListener("change", async () => {
            if (fileUploaded.files.length > 0) {
                uploadForm.submit(); //when files are submitted submit the form automatically
            }
        });

    </script>

    <h3>Made by: Nika</h3>

  </body>

</html>
