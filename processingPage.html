<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Test</title>

    <link rel="stylesheet" href="styles.css">

  </head>

  <body>

    <h1 class="charter">We are processing your request right now...</h1>

    <script type="module" src="firebaseInitializing.js"></script>

    <script type="module">
        
        import { auth, onAuthStateChanged, doc, db, collection, addDoc, setDoc } from "./firebaseInitializing.js?v1.0.0";

        let uid = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uid = user.uid;
                processImage();
            } else {
                console.log("No user is signed in.");
            }
        });

        async function processImage() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const fileName = urlParams.get('file');

                let fileDescription = "Clothes description from ai";

                let prompt = "Describe this piece of clothing in 1 sentence"
                const imageUrl = `https://yourstylist.stereopi.com/uploads/${uid}/${fileName}`;

                try {
                    const response = await fetch('/openai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: prompt,
                            image: imageUrl,
                        }),
                    });
                    console.log("Ai has answered! Response object: ", response);
                    const data = await response.json();
                    fileDescription = data.result;
                    // fileDescription = data.choices?.[0]?.message?.content; // Use the AI response
                    // fileDescription = response.output_text; // Use the AI response
                    console.log("AI response (parsed?): " + fileDescription);
                } catch (error) {
                    console.error('Error: ', error);
                }

                await setDoc(doc(db, "users", uid, "images", fileName), {
                    name: fileName,
                    description: fileDescription
                });

                // window.location.href = "/Wardrobe.html";
            } catch (error) {
                console.log("Error while loading: " + error);
            }
        }

    </script>

  </body>

</html>
