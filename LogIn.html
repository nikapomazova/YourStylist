<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>Log In</title>

    <style>

        .charter {
            font-family: "Charter", sans-serif;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal; 
        }

        .charter-bold {
            font-family: "Charter", sans-serif;
            font-optical-sizing: auto;
            font-weight: 1000;
            font-style: normal; 
        }

        h1 {
            text-align: center;
            color: #B15A63;
        }

        label {
            color: #B15A63;
        }

        p {
            color: #B15A63;
            font-family: "Arial", serif;
            text-align: center;
        }

      body {
        background-color: #f2d8ca;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .form-group label {
        width: 200px;
        text-align: right;
        margin-right: 10px;
      }

      .form-group input {
        width: 200px;
        padding: 5px;
      }

      #loginButton:enabled {
        display: block;
        margin: 10px auto;
        padding: 10 20;
        color: #B15A63;
        background-color: #ffffff;
        cursor: pointer;
      }

      #loginButton:disabled {
        display: block;
        margin: 10px auto;
        padding: 10 20;
        color: #B15A63;
        background-color: #eac3ae;
      }

      #redirectButton{
        background-color: #ffffff;
        color: #B15A63;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 class="charter-bold">Log In Screen</h1>

    <div class="form-group">
      <label class="charter" for="email">Email:</label>
      <input class="charter" type="text" id="email" name="email" placeholder="example@gmail.com"/>
    </div>

    <div class="form-group">
      <label class="charter" for="pass"
        >Password (6 characters minimum):</label
      >
      <input
        class="charter"
        type="password"
        id="pass"
        name="password"
        minlength="6"
        placeholder="Enter your password"
      />
    </div>

    <button class="charter" id="loginButton" disabled>Log In</button>

    <a href="index.html" class="form-group">
      <button class="charter" id = "redirectButton">I don't have an account</button>
    </a>

  </body>
</html>
